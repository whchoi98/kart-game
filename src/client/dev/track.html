<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Track mesh preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; }

  <div id="app"></div>
  <div id="hud"></div>
  <script type="module" src="./track.ts"></script>
